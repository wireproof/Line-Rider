<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font:15px -apple-system}canvas{display:block;touch-action:none;width:100%;height:100%}#ui{position:absolute;top:max(5px,env(safe-area-inset-top));left:max(5px,env(safe-area-inset-left));right:max(5px,env(safe-area-inset-right));pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px}#tools,#colors{display:flex;gap:1px;flex-wrap:wrap;pointer-events:auto}button{color:#111;appearance:none;background:#fff;border:1px solid transparent;padding:0;width:43px;height:43px;display:grid;place-items:center;touch-action:manipulation}button.selected{border-color:#aaa;background:#f5f5f5}button:active{background:#ddd}button img{width:32px;height:32px;object-fit:contain}.sprite{width:24px;height:32px;background-image:url('Game.png');background-repeat:no-repeat}.color{width:28px;height:28px;display:block}.blue{background:blue}.red{background:red}.green{background:#00e900}#help{position:absolute;inset:0;display:none;place-items:center;background:#fffe;z-index:2}#help.visible{display:grid}#help img{width:min(90vw,430px);height:auto}#help button{position:absolute;right:20px;top:max(20px,env(safe-area-inset-top));font-size:30px}#message{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));font:13px -apple-system;background:#ffffffe8;color:#444;pointer-events:none;opacity:0;transition:opacity .25s}#message.show{opacity:1}
</style></head><body><canvas id="canvas"></canvas><div id="ui"><div id="tools"><button id="pencil" class="selected" aria-label="Pencil"><span class="sprite" style="background-position:0 0"></span></button><button id="eraser" aria-label="Eraser"><span class="sprite" style="background-position:-65px 0"></span></button><button id="zoom" aria-label="Zoom"><span class="sprite" style="background-position:-95px 0"></span></button><button id="pan" aria-label="Move"><span class="sprite" style="background-position:-126px 0"></span></button><button id="play" aria-label="Play"><span class="sprite" style="background-position:-155px 0"></span></button><button id="stop" aria-label="Stop"><span class="sprite" style="background-position:-155px 0;transform:scale(.65);background-image:none;background-color:#000;width:28px;height:28px"></span></button><button id="start" aria-label="Return to start"><span class="sprite" style="background-position:-216px 0"></span></button><button id="save" aria-label="Save"><span class="sprite" style="background-position:-244px 0"></span></button><button id="clear" aria-label="Clear"><span class="sprite" style="background-position:-277px 0"></span></button><button id="helpButton" aria-label="Help"><span style="font:bold 25px Georgia">?</span></button></div><div id="colors"><button data-tool="0" class="selected" aria-label="Blue line"><span class="color blue"></span></button><button data-tool="1" aria-label="Red acceleration line"><span class="color red"></span></button><button data-tool="2" aria-label="Green scenery line"><span class="color green"></span></button><button id="undo" aria-label="Undo"><span style="font-size:26px">↶</span></button></div></div><div id="message"></div><div id="help"><button id="closeHelp" aria-label="Close">×</button><img src="Help.png" alt="Quick start"></div><script src="engine.js"></script><script src="game.js"></script></body></html>
